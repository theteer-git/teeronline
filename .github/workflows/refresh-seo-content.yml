name: Refresh SEO content

on:
  workflow_dispatch:
  schedule:
    - cron: "05 19 * * *" # 00:35 IST daily

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh static archive rows and live dates
        run: npm run refresh:seo

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/scripts/refresh-seo-content.js package.json .github/workflows/refresh-seo-content.yml
          if git diff --cached --quiet; then
            echo "No SEO content changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh SEO dates and archive rows"
          git push
